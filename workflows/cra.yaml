
description:
  name: report-cra
  description: Configuration for Dofus set optimization

env:
  variables:
    REPO_ROOT: $(SPECROOT)/..
    
    OBJECTIVE: "elements"
    NORMALIZE_BY_APCOST: "true"
    EXCLUSIONS: "32121"
    INCLUSIONS: "7754" # Ocre

    ELEMENTS: "agi str cha int"
    MELEE: "false"
    RANGED: "true"
    WEAPON_RANGE: 7

    LEVEL: 200
    LEVEL_OFFSET: 10

    AP: 12
    MP: 5
    VIT: 4000
    RES_NEUTRAL: 15
    RES_FIRE: 15
    RES_AIR: 15
    RES_WATER: 15
    RES_EARTH: 15
    RANGE: 6

    CRIT: 85
    EXO: "ap:1 mp:1 crit:2 vit:200 range:1"
    DISTRIBUTED_POINTS: "none"
    SCROLLED: "true"

    REFERENCE: "17578 17579 17580 19984 19983 19985 19986 15190 18700 13673 739 13825 18043 7754 7043 694 7115"

batch:
  type: local

study:
  - name: run_training
    description: Run training for the CRISPRi workflow on SLURM
    run:
      cmd: |
        cd $(REPO_ROOT)

        flags=(
          "$(REPO_ROOT)/main.py"
          "--objective" "$(OBJECTIVE)"
          "--elements" $(ELEMENTS)
          "--level" "$(LEVEL)"
          "--level-offset" "$(LEVEL_OFFSET)"
          "--ap" "$(AP)"
          "--mp" "$(MP)"
          "--vit" "$(VIT)"
          "--res-neutral" "$(RES_NEUTRAL)"
          "--res-fire" "$(RES_FIRE)"
          "--res-air" "$(RES_AIR)"
          "--res-water" "$(RES_WATER)"
          "--res-earth" "$(RES_EARTH)"
          "--crit" "$(CRIT)"
          "--range" "$(RANGE)"
          "--path" "$(WORKSPACE)"
        )

        if [ "$(NORMALIZE_BY_APCOST)" = "true" ]; then
          flags+=("--normalize-by-apcost")
        fi
        if [ "$(EXCLUSIONS)" != "none" ]; then
          flags+=("--exclusions" $(EXCLUSIONS))
        fi
        if [ "$(INCLUSIONS)" != "none" ]; then
          flags+=("--inclusions" $(INCLUSIONS))
        fi
        if [ "$(SCROLLED)" = "true" ]; then
          flags+=("--scrolled")
        fi
        if [ "$(EXO)" != "none" ]; then
          flags+=("--exo" $(EXO))
        fi
        if [ "$(DISTRIBUTED_POINTS)" != "none" ]; then
          flags+=("--distributed-points" $(DISTRIBUTED_POINTS))
        fi
        if [ "$(WEAPON_RANGE)" != "none" ]; then
          flags+=("--weapon-range" $(WEAPON_RANGE))
        fi
        if [ "$(MELEE)" = "true" ]; then
          flags+=("--melee")
        fi
        if [ "$(RANGED)" = "true" ]; then
          flags+=("--ranged")
        fi
        if [ "$(REFERENCE)" != "none" ]; then
          flags+=("--reference" $(REFERENCE))
        fi

        echo "Running with flags: ${flags[@]}"

        python "${flags[@]}"